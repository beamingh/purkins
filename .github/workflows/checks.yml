name: Purkins Minshop manual checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront:
    name: Verify Minshop foundation and Purkins theme
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Test private Purkins inventory and costing
        run: npx --no-install vitest run src/features/purkins
      - name: Enforce theme boundaries
        run: npm run theme:check
      - name: Check storefront contracts
        run: npm run test:storefront-contract
      - name: Type-check source
        run: npm run check
      - name: Build Astro Worker
        run: npm run build
