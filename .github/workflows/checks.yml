name: Purkins checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Unit tests and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve project dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test role and inventory permissions
        run: pnpm test:unit
      - name: Check source formatting and lint
        run: pnpm lint
      - name: Generate Cloudflare binding types
        run: pnpm generate:types:cloudflare
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build Payload application
        env:
          PAYLOAD_SECRET: ci-local-only-not-a-production-secret
        run: pnpm build
      - name: Generate migration on local D1 mock
        env:
          PAYLOAD_SECRET: ci-local-only-not-a-production-secret
        run: pnpm payload migrate:create purkins_initial
      - name: Validate migration against local D1
        env:
          PAYLOAD_SECRET: ci-local-only-not-a-production-secret
        run: pnpm payload migrate
      - name: Export migration source for review
        run: |
          for file in src/migrations/*.ts src/migrations/*.json; do
            echo "PURKINS_MIGRATION_BEGIN ${file}"
            cat "${file}"
            echo "PURKINS_MIGRATION_END ${file}"
          done
      - name: Archive generated migration for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: purkins-local-d1-migration
          path: src/migrations/
          if-no-files-found: error
