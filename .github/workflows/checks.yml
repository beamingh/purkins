name: Purkins Minshop manual checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront:
    name: Verify Minshop foundation and Purkins theme
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run full unit and Purkins integration test suite
        run: npm test
      - name: Enforce theme boundaries
        run: npm run theme:check
      - name: Check storefront contracts
        run: npm run test:storefront-contract
      - name: Type-check source
        run: npm run check
      - name: Build Astro Worker
        run: npm run build
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Install isolated MCP packages
        run: npm ci --prefix mcp
      - name: MCP typecheck and Worker dry run (not deployment)
        run: npm run mcp:check
      - name: Check MCP production dependency advisories
        run: npm audit --prefix mcp --omit=dev --audit-level=high
